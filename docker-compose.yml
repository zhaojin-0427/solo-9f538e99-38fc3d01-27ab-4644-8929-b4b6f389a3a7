services:
  web:
    build: .
    container_name: road-acceptance
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/acceptance.db
      # 限制 glibc 分配 arena 数量(每个预留 64MiB 虚拟地址空间),
      # 保证 256MiB 地址空间限制下大批次更正仍能提交成功
      MALLOC_ARENA_MAX: "1"
    volumes:
      - acceptance-data:/data
    restart: unless-stopped

volumes:
  acceptance-data:
